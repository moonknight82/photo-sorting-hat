[workspace]
members = ["crates/engine", "crates/cli", "src-tauri"]
default-members = ["crates/engine", "crates/cli"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
photo-hat-engine = { path = "crates/engine" }
