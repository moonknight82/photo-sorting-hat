chrono = "0.4"
walkdir = "2"
uuid = { version = "1", features = ["v4"] }
fs2 = "0.4"
unicode-normalization = "0.1"
rustix = { version = "1", features = ["fs"] }

[dev-dependencies]
tempfile = "3"
